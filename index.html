<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FRONTLINE — Multiplayer Real-Time Strategy Game">
  <title>FRONTLINE — RTS</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #0a0e17;
      --surface: #111827;
      --surface2: #1e293b;
      --accent: #38bdf8;
      --accent2: #818cf8;
      --green: #22c55e;
      --red: #ef4444;
      --gold: #fbbf24;
      --text: #e2e8f0;
      --dim: #64748b;
      --glass: rgba(17, 24, 39, .72);
      --border: rgba(56, 189, 248, .15);
      --gradient: linear-gradient(135deg, #38bdf8, #818cf8);
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden
    }

    /* ─── LOBBY ───────────────────────────────────────── */
    #lobby {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      position: relative;
      z-index: 10
    }

    #lobby.hidden {
      display: none
    }

    .lobby-bg {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0a0e17 0%, #1a1040 40%, #0a0e17 100%);
      z-index: -1
    }

    .lobby-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 30%, rgba(56, 189, 248, .08), transparent 60%)
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: .15em;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 60px rgba(56, 189, 248, .3);
      margin-bottom: .25rem;
      animation: glowPulse 3s ease-in-out infinite alternate
    }

    .logo-sub {
      font-size: .9rem;
      color: var(--dim);
      letter-spacing: .6em;
      text-transform: uppercase;
      margin-bottom: 3rem
    }

    @keyframes glowPulse {
      0% {
        filter: drop-shadow(0 0 8px rgba(56, 189, 248, .3))
      }

      100% {
        filter: drop-shadow(0 0 24px rgba(129, 140, 248, .6))
      }
    }

    .lobby-card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2.5rem;
      width: min(420px, 90vw);
      backdrop-filter: blur(24px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .4)
    }

    .lobby-card h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      letter-spacing: .12em;
      margin-bottom: 1.5rem;
      color: var(--accent)
    }

    .field {
      margin-bottom: 1.2rem
    }

    .field label {
      display: block;
      font-size: .75rem;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: .4rem
    }

    .field input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: .5rem;
      padding: .7rem 1rem;
      color: var(--text);
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border .2s
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, .12)
    }

    .btn {
      width: 100%;
      padding: .8rem;
      border: none;
      border-radius: .5rem;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-size: .85rem;
      letter-spacing: .12em;
      transition: all .2s;
      position: relative;
      overflow: hidden
    }

    .btn-primary {
      background: var(--gradient);
      color: #0a0e17;
      font-weight: 700
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(56, 189, 248, .35)
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent);
      margin-top: .6rem
    }

    .btn-secondary:hover {
      background: rgba(56, 189, 248, .08);
      border-color: var(--accent)
    }

    .divider {
      display: flex;
      align-items: center;
      gap: .8rem;
      margin: 1.5rem 0;
      color: var(--dim);
      font-size: .75rem
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border)
    }

    .error-msg {
      color: var(--red);
      font-size: .8rem;
      margin-top: .5rem;
      min-height: 1.2rem
    }

    /* ─── WAITING ROOM ────────────────────────────────── */
    #waitingRoom {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      position: relative;
      z-index: 10
    }

    #waitingRoom.show {
      display: flex
    }

    .room-code-display {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem;
      letter-spacing: .3em;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: .5rem 0
    }

    .player-list {
      list-style: none;
      padding: 0;
      margin: 1.5rem 0;
      width: 100%
    }

    .player-list li {
      display: flex;
      align-items: center;
      gap: .8rem;
      padding: .6rem 1rem;
      border-radius: .5rem;
      margin-bottom: .4rem;
      background: rgba(255, 255, 255, .03);
      border: 1px solid rgba(255, 255, 255, .05);
      font-size: .9rem
    }

    .player-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .host-badge {
      font-size: .65rem;
      background: var(--gold);
      color: #000;
      padding: 2px 8px;
      border-radius: 10rem;
      font-weight: 600;
      margin-left: auto
    }

    /* ─── GAME SCREEN ─────────────────────────────────── */
    #gameScreen {
      display: none;
      position: relative;
      width: 100%;
      height: 100%
    }

    #gameScreen.show {
      display: block
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair
    }

    /* ─── HUD ─────────────────────────────────────────── */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      padding: .6rem 1.2rem;
      background: linear-gradient(180deg, rgba(10, 14, 23, .92), rgba(10, 14, 23, .6));
      border-bottom: 1px solid var(--border);
      gap: 1.5rem;
      pointer-events: auto;
      z-index: 20
    }

    .hud-logo {
      font-family: 'Orbitron', sans-serif;
      font-size: .9rem;
      font-weight: 700;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent
    }

    .res-group {
      display: flex;
      gap: 1.2rem;
      flex: 1;
      justify-content: center
    }

    .res-item {
      display: flex;
      align-items: center;
      gap: .35rem;
      font-size: .8rem;
      font-weight: 500
    }

    .res-icon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .65rem
    }

    .res-wood {
      background: #65a30d
    }

    .res-steel {
      background: #64748b
    }

    .res-fuel {
      background: #f59e0b
    }

    .res-supplies {
      background: #06b6d4
    }

    .res-research {
      background: #a855f7
    }

    /* ─── BOTTOM PANEL ────────────────────────────────── */
    #bottomPanel {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      background: var(--glass);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 1rem 1rem 0 0;
      backdrop-filter: blur(20px);
      padding: 1rem 1.5rem;
      display: flex;
      gap: 1.2rem;
      z-index: 20;
      pointer-events: auto;
      max-width: 95vw;
      overflow-x: auto
    }

    .train-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .3rem;
      padding: .5rem .7rem;
      border-radius: .6rem;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .03);
      cursor: pointer;
      transition: all .15s;
      min-width: 68px
    }

    .train-btn:hover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, .08);
      transform: translateY(-2px)
    }

    .train-btn.disabled {
      opacity: .35;
      cursor: not-allowed;
      transform: none
    }

    .train-icon {
      font-size: 1.4rem
    }

    .train-name {
      font-size: .55rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--dim);
      font-weight: 600
    }

    .train-cost {
      font-size: .5rem;
      color: var(--dim)
    }

    /* ─── QUEUE DISPLAY ───────────────────────────────── */
    #queuePanel {
      position: absolute;
      bottom: 90px;
      right: 12px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: .8rem;
      backdrop-filter: blur(20px);
      padding: .8rem 1rem;
      z-index: 20;
      pointer-events: auto;
      min-width: 160px
    }

    #queuePanel.hidden {
      display: none
    }

    #queuePanel h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: .65rem;
      letter-spacing: .1em;
      color: var(--accent);
      margin-bottom: .5rem
    }

    .queue-item {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .75rem;
      padding: .25rem 0
    }

    .queue-bar {
      flex: 1;
      height: 4px;
      background: var(--surface);
      border-radius: 2px;
      overflow: hidden
    }

    .queue-bar-fill {
      height: 100%;
      background: var(--gradient);
      border-radius: 2px;
      transition: width .3s
    }

    /* ─── SELECTION INFO ──────────────────────────────── */
    #selectionInfo {
      position: absolute;
      bottom: 90px;
      left: 12px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: .8rem;
      backdrop-filter: blur(20px);
      padding: .8rem 1rem;
      z-index: 20;
      pointer-events: auto;
      min-width: 180px
    }

    #selectionInfo.hidden {
      display: none
    }

    #selectionInfo h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: .65rem;
      letter-spacing: .1em;
      color: var(--accent);
      margin-bottom: .5rem
    }

    .sel-stat {
      font-size: .75rem;
      color: var(--dim);
      margin-bottom: .2rem
    }

    .sel-hp-bar {
      width: 100%;
      height: 5px;
      background: var(--surface);
      border-radius: 3px;
      margin-top: .3rem;
      overflow: hidden
    }

    .sel-hp-fill {
      height: 100%;
      background: var(--green);
      border-radius: 3px;
      transition: width .3s
    }

    /* ─── BONUSES PANEL ───────────────────────────────── */
    #bonusPanel {
      position: absolute;
      top: 52px;
      left: 12px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: .6rem;
      backdrop-filter: blur(20px);
      padding: .6rem .8rem;
      z-index: 20;
      pointer-events: auto;
      min-width: 160px
    }

    #bonusPanel.hidden {
      display: none
    }

    #bonusPanel h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: .6rem;
      letter-spacing: .1em;
      color: var(--gold);
      margin-bottom: .4rem
    }

    .bonus-item {
      font-size: .7rem;
      color: var(--accent);
      padding: .15rem 0;
      display: flex;
      align-items: center;
      gap: .4rem
    }

    .bonus-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      animation: bonusPulse 2s ease-in-out infinite
    }

    @keyframes bonusPulse {

      0%,
      100% {
        opacity: .5
      }

      50% {
        opacity: 1
      }
    }

    /* ─── MINIMAP ─────────────────────────────────────── */
    #minimap {
      position: absolute;
      top: 52px;
      right: 12px;
      width: 180px;
      height: 180px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: .6rem;
      overflow: hidden;
      z-index: 20;
      pointer-events: auto;
      cursor: pointer
    }

    #minimapCanvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated
    }

    /* ─── TOAST ───────────────────────────────────────── */
    #toasts {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: .4rem;
      align-items: center;
      pointer-events: none
    }

    .toast {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: .5rem;
      padding: .5rem 1.2rem;
      font-size: .8rem;
      backdrop-filter: blur(12px);
      animation: toastIn .3s ease, toastOut .3s ease 2.7s forwards;
      pointer-events: none
    }

    .toast.combat {
      border-color: var(--red)
    }

    .toast.bonus {
      border-color: var(--gold)
    }

    .toast.victory {
      border-color: var(--green);
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      padding: .8rem 2rem
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(-10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes toastOut {
      from {
        opacity: 1
      }

      to {
        opacity: 0;
        transform: translateY(-10px)
      }
    }

    /* ─── COMBAT FLASH ────────────────────────────────── */
    .combat-flash {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(239, 68, 68, .6), transparent);
      animation: flashAnim .4s ease-out forwards;
      z-index: 15
    }

    @keyframes flashAnim {
      0% {
        transform: scale(0);
        opacity: 1
      }

      100% {
        transform: scale(2);
        opacity: 0
      }
    }

    /* ─── GAME OVER OVERLAY ──────────────────────────── */
    #gameOverlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(10, 14, 23, .85);
      backdrop-filter: blur(8px);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center
    }

    #gameOverlay.show {
      display: flex
    }

    .go-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      margin-bottom: .5rem
    }

    .go-winner {
      font-size: 1.3rem;
      margin-bottom: 2rem;
      color: var(--dim)
    }

    .go-stats {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: .8rem;
      padding: 1.5rem;
      min-width: 360px;
      max-width: 90vw
    }

    .go-stats table {
      width: 100%;
      border-collapse: collapse
    }

    .go-stats th {
      font-family: 'Orbitron', sans-serif;
      font-size: .6rem;
      letter-spacing: .1em;
      color: var(--dim);
      text-align: left;
      padding: .4rem .6rem;
      border-bottom: 1px solid var(--border)
    }

    .go-stats td {
      font-size: .8rem;
      padding: .4rem .6rem;
      border-bottom: 1px solid rgba(255, 255, 255, .03)
    }

    .go-stats tr.winner td {
      color: var(--gold)
    }

    /* scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px
    }

    ::-webkit-scrollbar-track {
      background: transparent
    }

    ::-webkit-scrollbar-thumb {
      background: var(--dim);
      border-radius: 3px
    }
  </style>
</head>

<body>

  <!-- ── LOBBY ───────────────────────────────────────── -->
  <div class="lobby-bg"></div>
  <div id="lobby">
    <div class="logo">FRONTLINE</div>
    <div class="logo-sub">Real-Time Strategy</div>
    <div class="lobby-card">
      <h2>Deploy</h2>
      <div class="field"><label>Commander Name</label><input id="nameInput" placeholder="Enter your callsign"
          maxlength="16" autocomplete="off"></div>
      <button class="btn btn-primary" id="createBtn">Create Room</button>
      <div class="divider">OR JOIN</div>
      <div class="field"><label>Room Code</label><input id="codeInput" placeholder="6-character code" maxlength="6"
          autocomplete="off" style="text-transform:uppercase"></div>
      <button class="btn btn-secondary" id="joinBtn">Join Room</button>
      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>

  <!-- ── WAITING ROOM ───────────────────────────────── -->
  <div id="waitingRoom">
    <div class="lobby-card" style="text-align:center">
      <h2>War Room</h2>
      <div style="font-size:.75rem;color:var(--dim);text-transform:uppercase;letter-spacing:.1em">Room Code</div>
      <div class="room-code-display" id="roomCodeDisplay">------</div>
      <ul class="player-list" id="playerList"></ul>
      <button class="btn btn-primary" id="startBtn" style="display:none">Launch Game</button>
      <div style="font-size:.75rem;color:var(--dim);margin-top:.8rem" id="waitingMsg">Waiting for host to start...</div>
    </div>
  </div>

  <!-- ── GAME SCREEN ────────────────────────────────── -->
  <div id="gameScreen">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div class="hud-logo">FRONTLINE</div>
      <div class="res-group">
        <div class="res-item">
          <div class="res-icon res-wood">🪵</div><span id="resWood">0</span>
        </div>
        <div class="res-item">
          <div class="res-icon res-steel">⚙</div><span id="resSteel">0</span>
        </div>
        <div class="res-item">
          <div class="res-icon res-fuel">⛽</div><span id="resFuel">0</span>
        </div>
        <div class="res-item">
          <div class="res-icon res-supplies">📦</div><span id="resSupplies">0</span>
        </div>
        <div class="res-item">
          <div class="res-icon res-research">🔬</div><span id="resResearch">0</span>
        </div>
      </div>
    </div>

    <div id="bonusPanel" class="hidden">
      <h3>⚡ Active Bonuses</h3>
      <div id="bonusContent"></div>
    </div>
    <div id="minimap"><canvas id="minimapCanvas" width="180" height="180"></canvas></div>
    <div id="selectionInfo" class="hidden">
      <h3>Selected</h3>
      <div id="selContent"></div>
    </div>
    <div id="queuePanel" class="hidden">
      <h3>Training Queue</h3>
      <div id="queueContent"></div>
    </div>
    <div id="bottomPanel"></div>
    <div id="toasts"></div>

    <!-- Game Over -->
    <div id="gameOverlay">
      <div class="go-title" id="goTitle"></div>
      <div class="go-winner" id="goWinner"></div>
      <div class="go-stats">
        <table>
          <thead>
            <tr>
              <th>Player</th>
              <th>Hexes</th>
              <th>Kills</th>
              <th>Lost</th>
              <th>Resources</th>
            </tr>
          </thead>
          <tbody id="goStatsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    (() => {
      'use strict';

      const MAP_SIZE = 80;
      const HEX_SIZE = 26;
      const HEX_W = Math.sqrt(3) * HEX_SIZE;
      const HEX_H = 2 * HEX_SIZE;

      const UNIT_ICONS = { SCOUT: '🏃', ARCHER: '🏹', INFANTRY: '⚔️', TANK: '🛡️', ARTILLERY: '💣', HELICOPTER: '🚁', MARINE: '🚢', EMP_DRONE: '⚡', DECOY: '👻' };
      const UNIT_MAX_HP = { SCOUT: 40, ARCHER: 60, INFANTRY: 100, TANK: 250, ARTILLERY: 80, HELICOPTER: 150, MARINE: 120, EMP_DRONE: 50, DECOY: 30 };
      const UNIT_TYPES = {
        SCOUT: { cost: { wood: 20 }, requiredZone: 'forest' }, ARCHER: { cost: { wood: 30, steel: 10 }, requiredZone: 'forest' },
        INFANTRY: { cost: { steel: 30 }, requiredZone: 'factory' }, TANK: { cost: { steel: 50, fuel: 20 }, requiredZone: 'factory' },
        ARTILLERY: { cost: { fuel: 40, steel: 30 }, requiredZone: 'oil' }, HELICOPTER: { cost: { fuel: 60, steel: 20 }, requiredZone: 'oil' },
        MARINE: { cost: { supplies: 30, steel: 20 }, requiredZone: 'port' }, EMP_DRONE: { cost: { research: 50, fuel: 20 }, requiredZone: 'lab' },
        DECOY: { cost: { research: 30 }, requiredZone: 'lab' }
      };
      const BONUS_NAMES = {
        ghostScouts: '👻 Ghost Scouts', armouredHelicopters: '🛡️ Armoured Helis',
        amphibiousArchers: '🌊 Amphibious Archers', tankShield: '⚡ Tank Shield',
        stealthDrones: '🔇 Stealth Drones', navalArtillery: '💥 Naval Artillery'
      };
      const TILE_COLOURS = { 0: '#1a2332', empty: '#1a2332', forest: '#1b3a26', factory: '#3a2e1e', oil: '#2e2215', port: '#152838', lab: '#2a1a3a' };
      const TILE_ICONS = { forest: '🌲', factory: '🏭', oil: '🛢️', port: '⚓', lab: '🔬' };

      // ─── STATE ──────────────────────────────────────────
      let socket, myId, isHost = false, roomCode = '';
      let map = null, players = [], units = [], resources = { wood: 0, steel: 0, fuel: 0, supplies: 0, research: 0 };
      let trainingQueue = [], activeBonuses = [];
      let selectedUnits = [];
      let cameraX = 0, cameraY = 0, zoom = 1;
      let selectionBox = null;
      let playerColours = {}, playerNames = {};
      let combatFlashes = []; // {x, y, time, color}
      let basePositions = {}; // playerId -> {row, col}

      // Smooth unit interpolation
      let unitPositions = {}; // unitId -> {x, y, targetX, targetY}

      const $ = id => document.getElementById(id);
      const lobby = $('lobby'), waitingRoom = $('waitingRoom'), gameScreen = $('gameScreen');
      const canvas = $('gameCanvas'), ctx = canvas.getContext('2d');
      const mmCanvas = $('minimapCanvas'), mmCtx = mmCanvas.getContext('2d');

      socket = io();
      socket.on('connect', () => { myId = socket.id; });

      // ─── LOBBY ──────────────────────────────────────────
      $('createBtn').onclick = () => { socket.emit('createRoom', { name: $('nameInput').value.trim() || 'Commander' }) };
      $('joinBtn').onclick = () => {
        const code = $('codeInput').value.trim().toUpperCase();
        if (code.length !== 6) return showError('Enter a 6-character code');
        socket.emit('joinRoom', { name: $('nameInput').value.trim() || 'Commander', code });
      };
      $('startBtn').onclick = () => socket.emit('startGame');
      $('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('createBtn').click() });
      $('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('joinBtn').click() });
      function showError(msg) { $('errorMsg').textContent = msg; setTimeout(() => $('errorMsg').textContent = '', 3000) }

      // ─── SOCKET ─────────────────────────────────────────
      socket.on('error', d => showError(d.msg));

      socket.on('roomCreated', d => {
        roomCode = d.code; isHost = true;
        lobby.classList.add('hidden'); waitingRoom.classList.add('show');
        $('roomCodeDisplay').textContent = d.code; $('startBtn').style.display = 'block'; $('waitingMsg').textContent = 'You are the host';
        updatePlayerList(d.players);
      });

      socket.on('roomUpdated', d => {
        if (!waitingRoom.classList.contains('show') && !gameScreen.classList.contains('show')) { lobby.classList.add('hidden'); waitingRoom.classList.add('show') }
        updatePlayerList(d.players);
      });

      function updatePlayerList(pList) {
        const ul = $('playerList'); ul.innerHTML = '';
        pList.forEach((p, i) => {
          const li = document.createElement('li');
          li.innerHTML = `<span class="player-dot" style="background:${p.colour}"></span>${p.name}${i === 0 ? '<span class="host-badge">HOST</span>' : ''}`;
          ul.appendChild(li);
        });
      }

      socket.on('gameStarted', d => {
        waitingRoom.classList.remove('show'); gameScreen.classList.add('show');
        players = d.players; playerColours = {}; playerNames = {}; basePositions = {};
        d.players.forEach(p => { playerColours[p.id] = p.colour; playerNames[p.id] = p.name; basePositions[p.id] = { row: p.baseRow, col: p.baseCol } });
        map = [];
        for (let r = 0; r < MAP_SIZE; r++) { map[r] = []; for (let c = 0; c < MAP_SIZE; c++) { const t = d.map[r][c]; map[r][c] = { type: t.t === 0 ? 'empty' : t.t, owner: t.o } } }
        const me = players.find(p => p.id === myId);
        if (me) { const pos = hexToPixel(me.baseRow, me.baseCol); cameraX = pos.x - canvas.width / 2; cameraY = pos.y - canvas.height / 2; resources = me.resources }
        resizeCanvas(); buildTrainPanel(); requestAnimationFrame(gameLoop);
        toast('Game started! Capture zones and train units.');
      });

      socket.on('gameUpdate', d => {
        if (d.units) {
          // update smooth positions
          for (const u of d.units) {
            const pos = hexToPixel(u.row, u.col);
            if (!unitPositions[u.id]) { unitPositions[u.id] = { x: pos.x, y: pos.y, targetX: pos.x, targetY: pos.y } }
            else { unitPositions[u.id].targetX = pos.x; unitPositions[u.id].targetY = pos.y }
          }
          units = d.units;
          // cleanup removed units
          const ids = new Set(d.units.map(u => u.id));
          for (const k of Object.keys(unitPositions)) { if (!ids.has(k)) delete unitPositions[k] }
        }
        if (d.mapOwnership && map) { for (const ch of d.mapOwnership) { if (map[ch.r]) map[ch.r][ch.c].owner = ch.owner } }
        updateSelection();
      });

      socket.on('resourceUpdate', d => { resources = d; updateHud(); updateTrainButtons() });
      socket.on('playerUpdate', d => { if (d.resources) resources = d.resources; if (d.trainingQueue) trainingQueue = d.trainingQueue; updateHud(); updateQueuePanel(); updateTrainButtons() });
      socket.on('unitTrained', d => toast(`${d.unitType} trained! 🎖️`));
      socket.on('trainError', d => toast(d.msg));
      socket.on('unitsDestroyed', ids => { selectedUnits = selectedUnits.filter(id => !ids.includes(id)); updateSelection() });

      socket.on('unitMoved', (d) => {
        // handled in gameUpdate, but can do immediate visual
      });

      socket.on('hexCaptured', d => {
        if (map && map[d.r]) map[d.r][d.c].owner = d.owner;
      });

      socket.on('combatResult', d => {
        const pos = hexToPixel(d.defender.row, d.defender.col);
        combatFlashes.push({ x: pos.x, y: pos.y, time: Date.now(), color: playerColours[d.attacker.owner] || '#ef4444' });
        // update HP on local units
        for (const u of units) {
          if (u.id === d.attacker.id) u.currentHealth = d.attacker.hp;
          if (u.id === d.defender.id) u.currentHealth = d.defender.hp;
        }
      });

      socket.on('empDetonated', d => {
        const pos = hexToPixel(d.row, d.col);
        combatFlashes.push({ x: pos.x, y: pos.y, time: Date.now(), color: '#38bdf8' });
        toast('⚡ EMP Detonated!', 'combat');
      });

      socket.on('decoyRevealed', d => {
        if (d.attackerId === myId || units.find(u => u.id === d.attackerId && u.owner === myId)) {
          toast('👻 DECOY!', 'combat');
        }
      });

      socket.on('navalStrikeEffect', d => {
        const pos = hexToPixel(d.row, d.col);
        combatFlashes.push({ x: pos.x, y: pos.y, time: Date.now(), color: '#f59e0b' });
        toast('💥 Naval Strike!', 'combat');
      });

      socket.on('bonusUpdate', d => {
        activeBonuses = d.bonuses;
        updateBonusPanel();
        toast('⚡ Bonus activated!', 'bonus');
      });

      socket.on('playerEliminated', d => {
        toast(`☠️ ${d.name} eliminated!`, 'combat');
      });

      socket.on('gameOver', d => {
        $('gameOverlay').classList.add('show');
        if (d.winner) {
          $('goTitle').textContent = d.winner.id === myId ? 'VICTORY!' : 'DEFEAT';
          $('goTitle').style.color = d.winner.id === myId ? 'var(--green)' : 'var(--red)';
          const reasons = { domination: 'Domination (70% map)', last_standing: 'Last Standing', draw: 'Draw' };
          $('goWinner').textContent = `${d.winner.name} wins by ${reasons[d.reason] || d.reason}`;
        } else {
          $('goTitle').textContent = 'DRAW'; $('goTitle').style.color = 'var(--dim)'; $('goWinner').textContent = 'No winner';
        }
        const tbody = $('goStatsBody'); tbody.innerHTML = '';
        for (const [pid, s] of Object.entries(d.stats)) {
          const tr = document.createElement('tr');
          if (d.winner && pid === d.winner.id) tr.className = 'winner';
          tr.innerHTML = `<td><span style="color:${s.colour}">■</span> ${s.name}${s.eliminated ? ' ☠️' : ''}</td><td>${s.hexesOwned}</td><td>${s.unitsKilled}</td><td>${s.unitsLost}</td><td>${s.resourcesGathered}</td>`;
          tbody.appendChild(tr);
        }
      });

      // ─── HEX MATH ──────────────────────────────────────
      function hexToPixel(r, c) { return { x: HEX_W * (c + 0.5 * (r & 1)), y: HEX_H * 0.75 * r } }
      function pixelToHex(px, py) { const r = Math.round(py / (HEX_H * 0.75)); return { r: Math.max(0, Math.min(MAP_SIZE - 1, r)), c: Math.max(0, Math.min(MAP_SIZE - 1, Math.round(px / HEX_W - 0.5 * (r & 1)))) } }

      // ─── CANVAS ─────────────────────────────────────────
      function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight }
      window.addEventListener('resize', resizeCanvas); resizeCanvas();

      function drawHex(cx, cy, size, fillColor, owner) {
        ctx.beginPath();
        for (let i = 0; i < 6; i++) { const a = Math.PI / 180 * (60 * i - 30); if (i === 0) ctx.moveTo(cx + size * Math.cos(a), cy + size * Math.sin(a)); else ctx.lineTo(cx + size * Math.cos(a), cy + size * Math.sin(a)) }
        ctx.closePath(); ctx.fillStyle = fillColor; ctx.fill();
        if (owner && playerColours[owner]) { ctx.fillStyle = playerColours[owner] + '28'; ctx.fill() }
        ctx.strokeStyle = '#ffffff06'; ctx.lineWidth = .5; ctx.stroke();
      }

      function lerpUnit(id) {
        const p = unitPositions[id];
        if (!p) return null;
        const speed = 0.2;
        p.x += (p.targetX - p.x) * speed;
        p.y += (p.targetY - p.y) * speed;
        return { x: p.x, y: p.y };
      }

      function draw() {
        const now = Date.now();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = TILE_COLOURS[0]; ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (!map) return;

        ctx.save();
        ctx.translate(-cameraX * zoom, -cameraY * zoom); ctx.scale(zoom, zoom);

        const minR = Math.max(0, Math.floor(cameraY / (HEX_H * 0.75)) - 1);
        const maxR = Math.min(MAP_SIZE - 1, Math.ceil((cameraY + canvas.height / zoom) / (HEX_H * 0.75)) + 1);
        const minC = Math.max(0, Math.floor(cameraX / HEX_W) - 1);
        const maxC = Math.min(MAP_SIZE - 1, Math.ceil((cameraX + canvas.width / zoom) / HEX_W) + 1);

        // tiles
        for (let r = minR; r <= maxR; r++) {
          for (let c = minC; c <= maxC; c++) {
            const pos = hexToPixel(r, c); const tile = map[r][c];
            drawHex(pos.x, pos.y, HEX_SIZE, TILE_COLOURS[tile.type] || TILE_COLOURS[0], tile.owner);
            if (tile.type !== 'empty' && tile.type !== 0) { ctx.font = '11px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(TILE_ICONS[tile.type] || '', pos.x, pos.y) }
          }
        }

        // base markers
        for (const [pid, bp] of Object.entries(basePositions)) {
          const pos = hexToPixel(bp.row, bp.col);
          ctx.beginPath(); ctx.arc(pos.x, pos.y, HEX_SIZE * .8, 0, Math.PI * 2);
          ctx.strokeStyle = (playerColours[pid] || '#fff') + '60'; ctx.lineWidth = 2; ctx.setLineDash([4, 3]); ctx.stroke(); ctx.setLineDash([]);
          ctx.font = 'bold 8px Orbitron,sans-serif'; ctx.fillStyle = playerColours[pid] || '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
          ctx.fillText('⚑ BASE', pos.x, pos.y - HEX_SIZE * .6);
        }

        // units with smooth interpolation
        for (const u of units) {
          const lp = lerpUnit(u.id);
          const px = lp ? lp.x : hexToPixel(u.row, u.col).x;
          const py = lp ? lp.y : hexToPixel(u.row, u.col).y;
          const col = playerColours[u.owner] || '#fff';
          const isSelected = selectedUnits.includes(u.id);
          const isMine = u.owner === myId;

          // selection ring
          if (isSelected) {
            ctx.beginPath(); ctx.arc(px, py, HEX_SIZE * .6, 0, Math.PI * 2);
            ctx.fillStyle = col + '30'; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
          }

          // shadow
          ctx.beginPath(); ctx.ellipse(px, py + HEX_SIZE * .3, HEX_SIZE * .3, HEX_SIZE * .12, 0, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fill();

          // unit body
          ctx.beginPath(); ctx.arc(px, py, HEX_SIZE * .35, 0, Math.PI * 2);
          const grad = ctx.createRadialGradient(px - 3, py - 3, 2, px, py, HEX_SIZE * .35);
          grad.addColorStop(0, col); grad.addColorStop(1, col + 'aa');
          ctx.fillStyle = grad; ctx.fill();
          if (isMine) { ctx.strokeStyle = '#ffffff40'; ctx.lineWidth = 1; ctx.stroke() }

          // icon
          ctx.font = '11px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(UNIT_ICONS[u.type] || '?', px, py);

          // hp bar
          const maxHp = UNIT_MAX_HP[u.type] || 100; const hp = u.currentHealth / maxHp;
          const bw = HEX_SIZE * .6;
          ctx.fillStyle = '#00000080'; ctx.fillRect(px - bw, py - HEX_SIZE * .55, bw * 2, 3);
          ctx.fillStyle = hp > .5 ? '#22c55e' : hp > .25 ? '#f59e0b' : '#ef4444';
          ctx.fillRect(px - bw, py - HEX_SIZE * .55, bw * 2 * Math.max(0, hp), 3);

          // frozen
          if (u.frozen) { ctx.font = '9px serif'; ctx.fillStyle = '#38bdf8'; ctx.fillText('❄️', px + HEX_SIZE * .35, py - HEX_SIZE * .35) }

          // path line for selected own units
          if (isSelected && isMine && u.targetPath && u.targetPath.length > 0) {
            ctx.beginPath(); ctx.moveTo(px, py);
            for (const step of u.targetPath) { const sp = hexToPixel(step.row, step.col); ctx.lineTo(sp.x, sp.y) }
            ctx.strokeStyle = col + '50'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);
          }
        }

        // combat flashes
        combatFlashes = combatFlashes.filter(f => now - f.time < 500);
        for (const f of combatFlashes) {
          const age = (now - f.time) / 500;
          ctx.beginPath(); ctx.arc(f.x, f.y, HEX_SIZE * age * 2, 0, Math.PI * 2);
          ctx.fillStyle = f.color + (Math.floor((1 - age) * 80).toString(16).padStart(2, '0'));
          ctx.fill();
        }

        // selection box
        if (selectionBox) {
          ctx.strokeStyle = '#38bdf880'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
          const bx = Math.min(selectionBox.x1, selectionBox.x2), by = Math.min(selectionBox.y1, selectionBox.y2);
          ctx.strokeRect(bx, by, Math.abs(selectionBox.x2 - selectionBox.x1), Math.abs(selectionBox.y2 - selectionBox.y1));
          ctx.fillStyle = '#38bdf810'; ctx.fillRect(bx, by, Math.abs(selectionBox.x2 - selectionBox.x1), Math.abs(selectionBox.y2 - selectionBox.y1));
          ctx.setLineDash([]);
        }

        ctx.restore();
      }

      // ─── MINIMAP ────────────────────────────────────────
      let mmDirty = true;
      function drawMinimap() {
        if (!map) return;
        const w = 180, h = 180, s = w / MAP_SIZE;
        mmCtx.fillStyle = '#0a0e17'; mmCtx.fillRect(0, 0, w, h);
        for (let r = 0; r < MAP_SIZE; r++) {
          for (let c = 0; c < MAP_SIZE; c++) {
            const tile = map[r][c];
            mmCtx.fillStyle = tile.owner ? playerColours[tile.owner] : (tile.type !== 'empty' && tile.type !== 0 ? TILE_COLOURS[tile.type] + '80' : '#1a233240');
            mmCtx.fillRect(c * s, r * s, s + .5, s + .5);
          }
        }
        for (const u of units) { mmCtx.fillStyle = playerColours[u.owner] || '#fff'; mmCtx.fillRect(u.col * s - .5, u.row * s - .5, 2, 2) }
        mmCtx.strokeStyle = '#38bdf8'; mmCtx.lineWidth = 1;
        mmCtx.strokeRect((cameraX / HEX_W) * s, (cameraY / (HEX_H * 0.75)) * s, (canvas.width / zoom / HEX_W) * s, (canvas.height / zoom / (HEX_H * 0.75)) * s);
      }

      // ─── INPUT ──────────────────────────────────────────
      let mouseDown = false, rightDown = false, panStart = null;

      canvas.addEventListener('mousedown', e => {
        if (e.button === 2) { rightDown = true; panStart = { x: e.clientX + cameraX, y: e.clientY + cameraY }; return }
        mouseDown = true;
        const wx = e.clientX / zoom + cameraX, wy = e.clientY / zoom + cameraY;
        selectionBox = { x1: wx, y1: wy, x2: wx, y2: wy };
      });

      canvas.addEventListener('mousemove', e => {
        if (rightDown && panStart) { cameraX = panStart.x - e.clientX; cameraY = panStart.y - e.clientY; return }
        if (mouseDown && selectionBox) { selectionBox.x2 = e.clientX / zoom + cameraX; selectionBox.y2 = e.clientY / zoom + cameraY }
      });

      canvas.addEventListener('mouseup', e => {
        if (e.button === 2) { rightDown = false; panStart = null; return }
        mouseDown = false;
        if (!selectionBox) return;
        const bx1 = Math.min(selectionBox.x1, selectionBox.x2), by1 = Math.min(selectionBox.y1, selectionBox.y2);
        const bx2 = Math.max(selectionBox.x1, selectionBox.x2), by2 = Math.max(selectionBox.y1, selectionBox.y2);
        if (bx2 - bx1 < 5 && by2 - by1 < 5) {
          const wx = e.clientX / zoom + cameraX, wy = e.clientY / zoom + cameraY;
          const hex = pixelToHex(wx, wy);
          const clicked = units.find(u => u.owner === myId && u.row === hex.r && u.col === hex.c);
          if (clicked) { selectedUnits = e.shiftKey ? [...selectedUnits, clicked.id] : [clicked.id] }
          else if (selectedUnits.length > 0) { socket.emit('moveUnits', { unitIds: selectedUnits, row: hex.r, col: hex.c }) }
          else { selectedUnits = [] }
        } else {
          if (!e.shiftKey) selectedUnits = [];
          for (const u of units) {
            if (u.owner !== myId) continue;
            const lp = unitPositions[u.id]; const px = lp ? lp.x : hexToPixel(u.row, u.col).x; const py = lp ? lp.y : hexToPixel(u.row, u.col).y;
            if (px >= bx1 && px <= bx2 && py >= by1 && py <= by2 && !selectedUnits.includes(u.id)) selectedUnits.push(u.id);
          }
        }
        selectionBox = null; updateSelection();
      });

      canvas.addEventListener('contextmenu', e => e.preventDefault());
      canvas.addEventListener('wheel', e => {
        const oldZoom = zoom; zoom = Math.max(0.3, Math.min(3, zoom - e.deltaY * 0.001));
        cameraX = (e.clientX / oldZoom + cameraX) - e.clientX / zoom;
        cameraY = (e.clientY / oldZoom + cameraY) - e.clientY / zoom;
        e.preventDefault();
      }, { passive: false });

      $('minimap').addEventListener('click', e => {
        const rect = $('minimapCanvas').getBoundingClientRect(); const s = 180 / MAP_SIZE;
        const pos = hexToPixel((e.clientY - rect.top) / s, (e.clientX - rect.left) / s);
        cameraX = pos.x - canvas.width / 2 / zoom; cameraY = pos.y - canvas.height / 2 / zoom;
      });

      document.addEventListener('keydown', e => {
        if (!gameScreen.classList.contains('show')) return;
        if (e.key === 'Escape') { selectedUnits = []; updateSelection() }
        if (e.key === 'a' && e.ctrlKey) { e.preventDefault(); selectedUnits = units.filter(u => u.owner === myId).map(u => u.id); updateSelection() }
      });

      // ─── HUD ────────────────────────────────────────────
      function updateHud() { $('resWood').textContent = resources.wood || 0; $('resSteel').textContent = resources.steel || 0; $('resFuel').textContent = resources.fuel || 0; $('resSupplies').textContent = resources.supplies || 0; $('resResearch').textContent = resources.research || 0 }

      function buildTrainPanel() {
        const panel = $('bottomPanel'); panel.innerHTML = '';
        for (const [type, def] of Object.entries(UNIT_TYPES)) {
          const btn = document.createElement('div'); btn.className = 'train-btn'; btn.dataset.type = type;
          const costStr = Object.entries(def.cost).map(([k, v]) => `${v}${k[0].toUpperCase()}`).join(' ');
          btn.innerHTML = `<span class="train-icon">${UNIT_ICONS[type]}</span><span class="train-name">${type}</span><span class="train-cost">${costStr}</span>`;
          btn.onclick = () => socket.emit('trainUnit', { unitType: type });
          panel.appendChild(btn);
        }
        updateTrainButtons();
      }

      function updateTrainButtons() {
        document.querySelectorAll('.train-btn').forEach(btn => {
          const def = UNIT_TYPES[btn.dataset.type]; if (!def) return;
          let ok = true; for (const [r, a] of Object.entries(def.cost)) { if ((resources[r] || 0) < a) { ok = false; break } }
          btn.classList.toggle('disabled', !ok);
        });
      }

      function updateQueuePanel() {
        const panel = $('queuePanel'), content = $('queueContent');
        if (trainingQueue.length === 0) { panel.classList.add('hidden'); return }
        panel.classList.remove('hidden'); content.innerHTML = '';
        const now = Date.now();
        for (const item of trainingQueue) {
          const pct = Math.min(100, (now - item.startTime) / item.duration * 100);
          const div = document.createElement('div'); div.className = 'queue-item';
          div.innerHTML = `<span>${UNIT_ICONS[item.unitType] || '?'} ${item.unitType}</span><div class="queue-bar"><div class="queue-bar-fill" style="width:${pct}%"></div></div>`;
          content.appendChild(div);
        }
      }

      function updateSelection() {
        const panel = $('selectionInfo'), content = $('selContent');
        if (selectedUnits.length === 0) { panel.classList.add('hidden'); return }
        panel.classList.remove('hidden');
        if (selectedUnits.length === 1) {
          const u = units.find(u => u.id === selectedUnits[0]); if (!u) { panel.classList.add('hidden'); return }
          const maxHp = UNIT_MAX_HP[u.type] || 100; const hp = u.currentHealth / maxHp * 100;
          content.innerHTML = `<div class="sel-stat" style="color:var(--text);font-weight:600">${UNIT_ICONS[u.type]} ${u.type}</div>
      <div class="sel-stat">HP: ${u.currentHealth}/${maxHp}</div>
      <div class="sel-hp-bar"><div class="sel-hp-fill" style="width:${hp}%;background:${hp > 50 ? 'var(--green)' : hp > 25 ? 'var(--gold)' : 'var(--red)'}"></div></div>
      <div class="sel-stat" style="margin-top:.3rem">Pos: (${u.row}, ${u.col})</div>${u.frozen ? '<div class="sel-stat" style="color:var(--accent)">❄ FROZEN</div>' : ''}`;
        } else {
          const counts = {}; for (const id of selectedUnits) { const u = units.find(u => u.id === id); if (u) counts[u.type] = (counts[u.type] || 0) + 1 }
          content.innerHTML = `<div class="sel-stat" style="color:var(--text);font-weight:600">${selectedUnits.length} units</div>` + Object.entries(counts).map(([t, n]) => `<div class="sel-stat">${UNIT_ICONS[t]} ${t} ×${n}</div>`).join('');
        }
      }

      function updateBonusPanel() {
        const panel = $('bonusPanel'), content = $('bonusContent');
        if (activeBonuses.length === 0) { panel.classList.add('hidden'); return }
        panel.classList.remove('hidden');
        content.innerHTML = activeBonuses.map(b => `<div class="bonus-item"><span class="bonus-dot"></span>${BONUS_NAMES[b] || b}</div>`).join('');
      }

      function toast(msg, type) {
        const div = document.createElement('div'); div.className = 'toast' + (type ? ' ' + type : '');
        div.textContent = msg; $('toasts').appendChild(div); setTimeout(() => div.remove(), 3000);
      }

      // ─── GAME LOOP ──────────────────────────────────────
      let lastMmDraw = 0;
      function gameLoop(ts) {
        draw();
        if (ts - lastMmDraw > 250) { drawMinimap(); lastMmDraw = ts }
        updateQueuePanel();
        requestAnimationFrame(gameLoop);
      }

    })();
  </script>
